name: ConectaDesk CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar Docker Compose
        run: docker compose config

      - name: Validar sintaxe PHP
        run: |
          docker run --rm -v "$PWD:/app" -w /app php:8.3-cli \
            sh -c 'find . -name "*.php" -print0 | xargs -0 -n1 php -l'

      - name: Iniciar aplicação
        run: docker compose up -d --build

      - name: Aguardar aplicação
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Executar testes automatizados
        run: docker compose exec -T app php tests/smoke_test.php

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Encerrar ambiente
        if: always()
        run: docker compose down -v

  publish:
    name: Publicar imagem Docker
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome da imagem
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conectadesk" >> "$GITHUB_ENV"

      - name: Publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
