services:
  db:
    image: mysql:8.4
    container_name: conectadesk-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: conectadesk
      MYSQL_USER: conectadesk
      MYSQL_PASSWORD: conectadesk
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - conectadesk_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conectadesk-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: conectadesk
      DB_USER: conectadesk
      DB_PASSWORD: conectadesk
      APP_URL: http://localhost:8000
      MAIL_FROM: nao-responda@conectadesk.local
    ports:
      - "8000:8000"

volumes:
  conectadesk_mysql:
